[package]
name = "resonance"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Manishraj Yadav"]
description = "Resonance — native Windows music streaming app (WinUI via windows-reactor, data via saavnapi)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "resonance"
path = "src/main.rs"

[dependencies]
windows-reactor = "0.100"
saavnapi = { path = "../saavnapi" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Core",
    "Media_Playback",
    "Storage_Streams",
    "Win32_UI_Shell",
] }
